name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Siapkan Folder Web & Capacitor
        run: |
          mkdir -p www assets
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          elif [ -f "www/index.html" ]; then
            echo "File sudah ada di www/index.html"
          else
            FOUND_HTML=$(find . -maxdepth 3 -name "*.html" ! -path "./node_modules/*" | head -n 1)
            if [ -n "$FOUND_HTML" ]; then
              cp "$FOUND_HTML" www/index.html
            else
              echo "Error: Tidak ada file .html ditemukan di repository!"
              exit 1
            fi
          fi
          rm -rf android package.json package-lock.json capacitor.config.json capacitor.config.ts
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Generate Otomatis Ikon Etalase Toko
        run: |
          node -e '
          const fs = require("fs");
          const svg = `<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ef4444"/>
                <stop offset="100%" stop-color="#b91c1c"/>
              </linearGradient>
            </defs>
            <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
            <path d="M180 390L260 190H764L844 390H180Z" fill="#ffffff"/>
            <path d="M350 190L320 390M512 190V390M674 190L704 390" stroke="#dc2626" stroke-width="36"/>
            <path d="M180 390C180 436 218 472 264 472C310 472 346 436 346 390C346 436 384 472 430 472C476 472 512 436 512 390C512 436 548 472 594 472C640 472 678 436 678 390C678 436 714 472 760 472C806 472 844 436 844 390H180Z" fill="#fecaca"/>
            <path d="M245 478V780C245 805 265 825 290 825H734C759 825 779 805 779 780V478" fill="#ffffff" fill-opacity="0.22" stroke="#ffffff" stroke-width="52" stroke-linecap="round"/>
            <rect x="325" y="565" width="180" height="260" rx="34" fill="#4ade80"/>
            <circle cx="465" cy="700" r="22" fill="#14532d"/>
            <rect x="565" y="565" width="145" height="140" rx="28" fill="#ffffff" fill-opacity="0.92"/>
          </svg>`;
          fs.writeFileSync("assets/icon.svg", svg);
          '
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon.png
          rsvg-convert -w 2732 -h 2732 assets/icon.svg -o assets/splash.png

      - name: Inisialisasi Android & Pasang Ikon Launcher
        run: |
          npx cap init "Kasir Toko" "com.toko.kasir" --web-dir=www
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          find app/build/outputs/apk -name "*.apk"

      - name: Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Kasir-UMKM
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
